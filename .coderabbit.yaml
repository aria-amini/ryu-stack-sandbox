# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # Only the most important findings inline; the rest go in the summary.
  profile: quiet
  # Review only when the review-gate asks for it, by adding this label.
  auto_review:
    enabled: false
    labels:
      - needs-review
    auto_incremental_review: true
    # After this many reviewed commits, stop and let a human reconsider.
    auto_pause_after_reviewed_commits: 3
  # Approve when the latest commit is reviewed and every thread is resolved.
  auto_approvals:
    enabled: true
    # The PR author (agents comment as me) cannot approve with @coderabbitai approve.
    allow_author_approval: false
  # Size labels, applied by CodeRabbit during a review.
  suggested_labels: true
  auto_apply_labels: true
  mutually_exclusive_groups:
    size: [sm, md, lg, xl]
  labeling_instructions:
    - label: sm
      instructions: "Apply when the PR changes fewer than 50 lines, not counting lockfiles and generated files."
    - label: md
      instructions: "Apply when the PR changes 50 to 199 lines, not counting lockfiles and generated files."
    - label: lg
      instructions: "Apply when the PR changes 200 to 399 lines, not counting lockfiles and generated files."
    - label: xl
      instructions: "Apply when the PR changes 400 or more lines, not counting lockfiles and generated files."
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/*.lock"
  path_instructions:
    - path: ".github/**"
      instructions: "Check permissions, triggers and secret exposure. Flag anything that runs untrusted PR code with write access."
